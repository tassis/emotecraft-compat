plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${mod_loader}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://maven.kosmx.dev/' }
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = neo_version

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
        }
    }
}

dependencies {
    // Player Animator bundles BendyLib at runtime; only its API is needed to
    // compile the optional repair mixins in this compatibility mod.
    compileOnly "io.github.kosmx.bendy-lib:bendy-lib-forge:${bendylib_version}"
    compileOnly "dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}"
    compileOnly "maven.modrinth:entity-model-features:${emf_version}"
    compileOnly "maven.modrinth:entitytexturefeatures:${etf_version}"
    compileOnly "maven.modrinth:emotecraft:${emotecraft_version}"
    compileOnly "maven.modrinth:3dskinlayers:${skinlayers_version}"

    // Keep the complete compatibility stack available to the development client
    // without bundling any of these optional mods in the published artifact.
    runtimeOnly "io.github.kosmx.bendy-lib:bendy-lib-forge:${bendylib_version}"
    runtimeOnly "dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}"
    runtimeOnly "maven.modrinth:entity-model-features:${emf_version}"
    runtimeOnly "maven.modrinth:entitytexturefeatures:${etf_version}"
    runtimeOnly "maven.modrinth:emotecraft:${emotecraft_version}"
    runtimeOnly "maven.modrinth:3dskinlayers:${skinlayers_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "io.github.kosmx.bendy-lib:bendy-lib-forge:${bendylib_version}"
    testImplementation "dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}"
    testImplementation "maven.modrinth:entity-model-features:${emf_version}"
    testImplementation "maven.modrinth:entitytexturefeatures:${etf_version}"
    testImplementation "maven.modrinth:emotecraft:${emotecraft_version}"
    testImplementation "maven.modrinth:3dskinlayers:${skinlayers_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    from('LICENSE')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            neo_version: neo_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
