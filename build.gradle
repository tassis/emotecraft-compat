buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-${mod_loader}-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run-client')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {}
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.kosmx.dev/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly fg.deobf("io.github.kosmx.bendy-lib:bendy-lib-forge:${bendylib_version}")
    compileOnly fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}")
    compileOnly fg.deobf("maven.modrinth:entity-model-features:${emf_version}")
    compileOnly fg.deobf("maven.modrinth:entitytexturefeatures:${etf_version}")
    compileOnly fg.deobf("maven.modrinth:emotecraft:${emotecraft_version}")

    runtimeOnly fg.deobf("io.github.kosmx.bendy-lib:bendy-lib-forge:${bendylib_version}")
    runtimeOnly fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}")
    runtimeOnly fg.deobf("maven.modrinth:entity-model-features:${emf_version}")
    runtimeOnly fg.deobf("maven.modrinth:entitytexturefeatures:${etf_version}")
    runtimeOnly fg.deobf("maven.modrinth:emotecraft:${emotecraft_version}")

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation fg.deobf("io.github.kosmx.bendy-lib:bendy-lib-forge:${bendylib_version}")
    testImplementation fg.deobf("dev.kosmx.player-anim:player-animation-lib-forge:${player_animator_version}")
    testImplementation fg.deobf("maven.modrinth:entity-model-features:${emf_version}")
    testImplementation fg.deobf("maven.modrinth:entitytexturefeatures:${etf_version}")
    testImplementation fg.deobf("maven.modrinth:emotecraft:${emotecraft_version}")
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('compileJava')

    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
    from(layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json')) {
        rename { "${mod_id}.refmap.json" }
    }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('LICENSE')
    manifest.attributes('MixinConfigs': "${mod_id}.mixins.json")
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('compileJava', JavaCompile).configure {
    outputs.file(layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json'))
            .withPropertyName('mixinRefmap')
    outputs.file(layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg'))
            .withPropertyName('mixinMappings')
}
