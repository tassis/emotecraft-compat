name: Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    outputs:
      version: ${{ steps.version.outputs.value }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          gradle-version: '9.2.1'

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          minecraft_version="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          mod_loader="$(sed -n 's/^mod_loader=//p' gradle.properties)"
          mod_id="$(sed -n 's/^mod_id=//p' gradle.properties)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "mod_version is invalid: $version" >&2
            exit 1
          fi
          if [[ ! "$minecraft_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "minecraft_version must be numeric, got: $minecraft_version" >&2
            exit 1
          fi
          if [[ ! "$mod_loader" =~ ^[a-z0-9-]+$ ]]; then
            echo "mod_loader must contain only lowercase letters, numbers, and hyphens, got: $mod_loader" >&2
            exit 1
          fi
          if [[ ! "$mod_id" =~ ^[a-z][a-z0-9_]*$ ]]; then
            echo "mod_id is invalid: $mod_id" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version=$version; expected v$version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${mod_id}-${mod_loader}-${minecraft_version}-${version}" >> "$GITHUB_OUTPUT"

      - name: Test and build
        run: gradle --no-daemon clean test build

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report-${{ github.run_number }}
          path: build/reports/tests/test/
          if-no-files-found: ignore

      - name: Upload mod JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: build/libs/${{ steps.version.outputs.artifact_name }}.jar
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download release JAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        shell: bash
        run: |
          jar="dist/${ARTIFACT_NAME}.jar"
          test -f "$jar"
          release_args=(
            "$GITHUB_REF_NAME"
            "$jar"
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --title "Emotecraft Compat ${VERSION}"
            --generate-notes
          )
          if [[ "$VERSION" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}"
