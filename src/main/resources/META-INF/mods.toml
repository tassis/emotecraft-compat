modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="emotecraft"
mandatory=true
versionRange="[2.2.7-b.build.50]"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="entity_model_features"
mandatory=false
versionRange="[3.3.12]"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="playeranimator"
mandatory=false
versionRange="[1.0.2-rc1+1.20]"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="bendylib"
mandatory=false
versionRange="[4.0.0]"
ordering="AFTER"
side="CLIENT"
