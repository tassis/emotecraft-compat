modLoader="javafml"
loaderVersion="[4,)"
license="All Rights Reserved"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/catman0221/emotecraft-fix-animate-texture"
description='''${mod_description}'''

[[mixins]]
config="emotecraft_fix_animate_texture.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="emotecraft"
type="required"
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="entity_model_features"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="playeranimator"
type="optional"
versionRange="[2.0,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="bendylib"
type="optional"
versionRange="[5.1,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="skinlayers3d"
type="optional"
versionRange="[1.11.2,)"
ordering="AFTER"
side="CLIENT"
